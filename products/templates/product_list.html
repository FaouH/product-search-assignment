<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

  <title>Product Search</title>

  <style>
    body { background: #f7f3ee; }
    .card-soft { border: 0; border-radius: 12px; }
    .coffee-title { color: #3b2f2f; }
    .badge-coffee { background: #6f4e37; color: white; }
  </style>
</head>

<body>

<div class="container py-5">

  <div class="text-center mb-4">
    <h1 class="coffee-title">Café Menu</h1>
    <p class="text-muted">Search the menu for items</p>
  </div>

  <!-- SEARCH FORM -->
  <div class="card card-soft mb-4">
    <div class="card-body">

      <form method="get" class="form-row">

        <div class="col-md-5">
          <input class="form-control"
                 name="search"
                 placeholder="Search..."
                 value="{{ search }}">
        </div>

        <div class="col-md-3">
          <select class="form-control" name="category">
            <option value="">All Categories</option>
            {% for c in categories %}
              <option value="{{ c.id }}"
                {% if selected_category == c.id|stringformat:"s" %}selected{% endif %}>
                {{ c.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-3">
          

  <label class="small text-muted">Tags</label>

  <div class="card card-soft p-2"
       style="max-height: 120px; overflow-y: auto;">

    {% for t in tags %}

      <div class="custom-control custom-checkbox">

        <input
          type="checkbox"
          class="custom-control-input"
          id="tag{{ t.id }}"
          name="tags"
          value="{{ t.id }}"
          {% if t.id|stringformat:"s" in selected_tags %}checked{% endif %}
        >

        <label class="custom-control-label small" for="tag{{ t.id }}">
          {{ t.name }}
        </label>

      </div>

    {% endfor %}

  </div>


        </div>

        <div class="col-md-1">
          <button class="btn btn-dark btn-block">Search</button>
        </div>

      </form>

    </div>
  </div>

  <!-- RESULTS -->
  <div class="row">

    {% for product in products %}

      <div class="col-md-4 mb-3">

        <div class="card card-soft h-100">

          <div class="card-body">

            <h5 class="coffee-title">{{ product.name }}</h5>
            <p class="text-muted small">{{ product.description }}</p>

            <span class="badge badge-coffee">
              {{ product.category.name }}
            </span>

            <div class="mt-2">
              {% for tag in product.tags.all %}
                <span class="badge badge-light border">
                  {{ tag.name }}
                </span>
              {% endfor %}
            </div>

          </div>

        </div>

      </div>

    {% empty %}

      <div class="col-12 text-center text-muted">
        No items match your search.
      </div>

    {% endfor %}

  </div>

</div>

</body>
</html>
